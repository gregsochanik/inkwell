# Hobitty — game definition
# All game content is defined here; the Rust engine is generic.

game:
  title: "HOBITTY"
  subtitle: "An 80s Text Adventure in Rust"
  tagline: "Loosely based on The Hobbit (1982)"
  start_room: bag_end
  banner: |4
             _   _  ___  ____ ___ _____ _______   __
            | | | |/ _ \| __ )_ _|_   _|_   _\ \ / /
            | |_| | | | |  _ \| |  | |   | |  \ V /
            |  _  | |_| | |_) | |  | |   | |   | |
            |_| |_|\___/|____/___| |_|   |_|   |_|
  intro: >-
    In a hole in the ground there lived a hobbit. Not a nasty,
    dirty, wet hole — it was a hobbit-hole, and that means comfort.


    You are {bold:Dobo Daggins}, a respectable hobbit of {bold:Bag End}. One
    morning a wizard and thirteen dwarves arrive at your door and
    before you know it, you've been swept up in an adventure.


    Type {bold:HELP} for a list of commands.

# -------------------------------------------------------------------
# Rooms
# -------------------------------------------------------------------
rooms:
  bag_end:
    name: "Bag End"
    description: >-
      You are standing in a comfortable hobbit-hole. A round green door
      leads outside. The walls are lined with shelves full of books,
      pantry jars, and maps. A warm fire crackles in the hearth.
      There is a strong smell of seed-cake.
    short_description: "You are back in the cosy comfort of Bag End."
    art: art/bag_end.ans
    exits:
      east: the_hill
    items:
      - map

  the_hill:
    name: "The Hill"
    description: >-
      You stand on a grassy hill overlooking the Shire. The sky is
      wide and blue. Bag End is behind you to the west. A winding
      path leads south toward a cheerful inn, and east toward dark
      woods.
    short_description: "You stand on the Hill, overlooking the Shire."
    art: art/the_hill.ans
    exits:
      west: bag_end
      south: green_dragon
      east: trollshaw

  green_dragon:
    name: "The Green Dragon Inn"
    description: >-
      A warm and noisy inn. Hobbits sit at wooden tables drinking
      ale and smoking pipe-weed. A stout barkeep polishes mugs
      behind the counter. Songs drift from a corner table. The door
      leads back north to the Hill.
    short_description: "You are in the warm and noisy Green Dragon Inn."
    art: art/green_dragon.ans
    exits:
      north: the_hill
    items:
      - elven_bread

  trollshaw:
    name: "Trollshaw Forest"
    description: >-
      Gnarled trees press close on all sides. The path is dim and
      overgrown. Strange sounds echo between the trunks. You feel
      distinctly unwelcome here. The way continues east, or you
      can retreat west.
    short_description: "You are in the dim depths of Trollshaw Forest."
    exits:
      west: the_hill
      east: troll_clearing
    items:
      - sword

  troll_clearing:
    name: "Troll Clearing"
    description: >-
      A trampled clearing littered with bones and broken carts.
      Three large stone shapes loom in the centre — the remains
      of trolls turned to stone at dawn. A faint path leads north
      toward distant waterfalls.
    short_description: "You are in the Troll Clearing. Stone trolls loom nearby."
    conditional_descriptions:
      - conditions:
          - !flag_unset trolls_defeated
        description: >-
          A trampled clearing littered with bones and broken carts.
          Three enormous trolls sit around a sputtering fire, arguing
          about how to cook their latest catch. They turn their ugly
          heads toward you and snarl. The path north toward the
          waterfalls is blocked by their bulk.
        short_description: >-
          You are in the Troll Clearing. Three enormous trolls block the path.
    exits:
      west: trollshaw
      north: rivendell

  rivendell:
    name: "Rivendell"
    description: >-
      The Last Homely House gleams in the afternoon sun. Elven
      music drifts on the breeze. Waterfalls cascade into crystal
      pools below. You feel rested and safe — for now. A steep
      path climbs east into the mountains.
    short_description: "You are in Rivendell. Elven music drifts on the breeze."
    exits:
      south: troll_clearing
      east: misty_pass

  misty_pass:
    name: "Misty Mountains Pass"
    description: >-
      A narrow ledge clings to the mountainside. Cold wind howls
      and snow stings your face. Thunder rumbles in the distance.
      The path is treacherous. A dark crack in the rock leads east
      into the mountain itself.
    short_description: "You are on the treacherous Misty Mountains Pass."
    exits:
      west: rivendell
      east: goblin_cave

  goblin_cave:
    name: "Goblin Cave"
    description: >-
      A damp, dark cave deep inside the mountain. Water drips from
      the ceiling and the air smells foul. Strange eyes glint in
      the darkness. On the floor, something glimmers faintly.
    short_description: "You are in the dark Goblin Cave. Water drips around you."
    description_when_empty: >-
      A damp, dark cave deep inside the mountain. Water drips from
      the ceiling and the air smells foul. Strange eyes glint in
      the darkness. The floor is bare rock, slick with moisture.
    exits:
      west: misty_pass
    items:
      - ring

  beorns_hall:
    name: "Beorn's Hall"
    description: >-
      You emerge from the eastern side of the Misty Mountains into
      a wide valley. A great wooden hall stands amid fields of
      clover, where enormous bees buzz lazily. The hall belongs to
      Beorn, a skin-changer — half man, half bear. The air smells
      of honey and fresh hay. The mountains rise behind you to
      the west, and open lands stretch east.
    short_description: "You are in Beorn's wide valley. His great hall stands nearby."
    exits:
      west: goblin_cave
      east: mirkwood

  mirkwood:
    name: "Mirkwood"
    description: >-
      You enter the dark eaves of Mirkwood. The trees grow so thick
      that barely any light reaches the forest floor. Strange sounds
      echo in the gloom — the scuttle of many legs, the snap of twigs.
      Thick cobwebs hang between the branches above. A thin path
      weaves east through the trees. Every instinct tells you not to
      leave it.
    short_description: "You are in the dark depths of Mirkwood. Cobwebs hang overhead."
    exits:
      west: beorns_hall
      east: lake_town

  lake_town:
    name: "Lake-town"
    description: >-
      A bustling town built on wooden stilts over the Long Lake.
      Fishermen mend their nets on the docks and children peer
      at you from doorways. Smoke rises from chimneys and the
      smell of fish stew fills the air. To the east, the Lonely
      Mountain rises like a dark tower against the sky, a thin
      wisp of smoke curling from its peak.
    short_description: "You are in Lake-town. The Lonely Mountain looms to the east."
    exits:
      west: mirkwood
      east: lonely_mountain

  lonely_mountain:
    name: "The Lonely Mountain"
    description: >-
      You stand at the foot of Erebor — the Lonely Mountain.
      The great peak towers above you, its slopes bare and grey.
      Somewhere on the western face, hidden from prying eyes,
      lies a secret door. Dragon-smoke drifts from a vent high
      above. The air is hot and smells of sulphur.
    short_description: "You stand before the Lonely Mountain. Dragon-smoke drifts above."
    exits:
      west: lake_town

# -------------------------------------------------------------------
# Items
# -------------------------------------------------------------------
items:
  map:
    name: "a weathered map"
    description: >-
      An old parchment map showing the Lonely Mountain, with a
      secret door marked in red ink. Moon-letters shimmer faintly
      along the border.

  sword:
    name: "a glowing elvish sword"
    description: >-
      A short blade of elvish make. It glows faintly blue. Runes
      along the blade read 'Sting'. It is just the right size for
      a hobbit.

  elven_bread:
    name: "a loaf of elven bread"
    description: >-
      A dense, golden loaf wrapped in a large leaf. One small bite
      fills you with warmth and energy. It smells faintly of honey.

  key:
    name: "an ornate key"
    description: >-
      A heavy iron key with dwarvish runes engraved on its bow.
      It looks very old and very important.

  ring:
    name: "a plain gold ring"
    description: >-
      A simple gold ring, surprisingly warm to the touch. When you
      hold it, the world seems to go quiet for a moment.

# -------------------------------------------------------------------
# NPCs
# -------------------------------------------------------------------
npcs:
  gandalf:
    name: "Gandalf the Grey"
    description: >-
      A tall old man in a grey cloak and pointed hat. His eyes
      twinkle with a knowing light beneath bushy eyebrows. He
      leans on a gnarled wooden staff.
    start_room: bag_end
    allowed_rooms:
      - bag_end
      - the_hill
      - trollshaw
      - troll_clearing
      - rivendell
      - misty_pass
    dialogue:
      - '"Good morning! Or is it? What do you mean by good morning?"'
      - '"I am looking for someone to share in an adventure."'
      - '"You''ll have a tale or two to tell when you come back."'
      - '"The world is not in your books and maps. It''s out there."'
      - '"All good stories deserve embellishment."'
    idle_texts:
      - "Gandalf puffs on his pipe, blowing a smoke ring shaped like a ship."
      - "Gandalf peers at you over his spectacles."
      - "Gandalf taps his staff on the ground thoughtfully."
      - "Gandalf mutters something about being late — or perhaps early."
      - "Gandalf gazes into the distance, as if seeing things far away."

  thorin:
    name: "Thorin Oakenshield"
    description: >-
      A proud dwarf with a long beard and a fur-trimmed cloak.
      He carries himself with the bearing of a king, though his
      eyes hold a deep sadness.
    start_room: the_hill
    allowed_rooms:
      - bag_end
      - the_hill
      - green_dragon
      - trollshaw
      - troll_clearing
      - rivendell
    dialogue:
      - '"I am Thorin, son of Thrain, son of Thror, King under the Mountain."'
      - '"We seek to reclaim our homeland from the dragon Smaug."'
      - '"This quest is not for the faint-hearted, halfling."'
      - '"The Arkenstone... I must have it."'
      - '"If more of us valued food and cheer above hoarded gold, it would be a merrier world."'
    idle_texts:
      - "Thorin sits down and starts singing about gold."
      - "Thorin strokes his beard and stares into the fire."
      - "Thorin polishes his sword with a distant look in his eyes."
      - "Thorin mutters darkly about dragons."
      - "Thorin hums a deep dwarven melody."

  elrond:
    name: "Elrond Half-elven"
    description: >-
      An ageless elf-lord with dark hair and wise grey eyes.
      He radiates calm authority. A circlet of silver rests
      upon his brow.
    start_room: rivendell
    allowed_rooms:
      - rivendell
    dialogue:
      - '"Welcome to Rivendell, little one."'
      - '"This map has moon-letters. Hold it up to the moonlight."'
      - '"The road ahead is perilous. Rest here while you can."'
      - '"Your blade is of elvish make — Orcrist''s kin. It will glow blue when goblins are near."'
      - '"Even the smallest person can change the course of the future."'
    idle_texts:
      - "Elrond studies an ancient tome with quiet concentration."
      - "Elrond gazes at the waterfalls, lost in memory."
      - "Elrond speaks softly to a passing elf in Sindarin."

  gollum:
    name: "Gollum"
    description: >-
      A wretched, thin creature with large pale eyes that glow
      in the dark. He crouches on a rock, muttering to himself
      and wringing his bony hands.
    start_room: goblin_cave
    allowed_rooms:
      - goblin_cave
    dialogue:
      - '"What has it got in its pocketses, precious?"'
      - '"We likes riddles, don''t we, precious? Yes we does!"'
      - '"It''s ours, precious. It came to us on our birthday."'
      - '"Thief! Baggins! We hates it forever!"'
      - '"Gollum! Gollum!"'
    idle_texts:
      - "Gollum splashes in the dark water, catching a blind fish."
      - "Gollum mutters \"my precious\" over and over to himself."
      - "Gollum watches you with huge, unblinking eyes."
      - "Gollum hisses and retreats into the shadows."

  beorn:
    name: "Beorn"
    description: >-
      A massive man with wild, dark hair and a thick beard. He
      moves with the heavy grace of a bear. His eyes are sharp
      and watchful, but not unkind.
    start_room: beorns_hall
    allowed_rooms:
      - beorns_hall
    dialogue:
      - '"I don''t much like dwarves. But I like goblins even less."'
      - '"You may stay the night. My animals will see to your needs."'
      - '"The forest of Mirkwood lies to the east. Do not leave the path!"'
      - '"I am Beorn. Some call me a skin-changer. It is not polite to ask why."'
      - '"Take some honey-cakes for the road. You will need your strength."'
    idle_texts:
      - "Beorn pours a great bowl of cream for a cat the size of a dog."
      - "Beorn sharpens a massive axe, humming a deep tune."
      - "Beorn gazes out at the mountains with a faraway look."
      - "A huge black dog trots up to Beorn and rests its head on his knee."

# -------------------------------------------------------------------
# Triggers
# -------------------------------------------------------------------
# Triggers are checked in order; first match wins.
# Template syntax: {npc:text} {item:text} {dialogue:text} {riddle:text}
#                  {exits:text} {danger:text} {bell}

triggers:
  # -- Movement blocks --

  - id: troll_block_north
    event: go
    direction: north
    conditions:
      - !in_room troll_clearing
      - !flag_unset trolls_defeated
    effects:
      - !print >-
          The trolls snarl and block your path north! They're
          enormous and very angry. You'll need to find another
          way past them.

  - id: goblin_cave_east_hint
    event: go
    direction: east
    conditions:
      - !in_room goblin_cave
      - !flag_unset riddle_won
    effects:
      - !print >-
          The cave seems to continue east, but the passages
          twist and double back on themselves. You can't find
          a way through. Gollum watches you from the shadows,
          muttering about games and riddles...

  # -- Wait events --

  - id: troll_wait
    event: wait
    conditions:
      - !in_room troll_clearing
      - !flag_unset trolls_defeated
    effects:
      - !set_flag trolls_defeated
      - !add_item
        room: troll_clearing
        item: key
      - !bell ~
      - !print |
          You hold very still and wait...

          The trolls continue arguing:
          "Let's roast 'em slowly!" says Tom.
          "No, sit on 'em and squash 'em into jelly!" says Bert.
          "You're both ninnies!" says William.

          From somewhere in the trees, a voice remarkably like William's calls out — "Dawn take you all, and be stone to you!"

          The trolls look up just as the first rays of sunlight break over the tree-tops. One by one, they stiffen, their skin turns grey, and they become... stone.

          {bell}Silence fills the clearing. Among the trolls' belongings, you notice {item:an ornate key} glinting in the morning light.

  # -- Attack events --

  - id: troll_attack
    event: attack
    target: troll
    conditions:
      - !in_room troll_clearing
      - !flag_unset trolls_defeated
    effects:
      - !game_over
        message: >-
          You charge at the trolls, but they are enormous —
          each one three times your size. Tom grabs you before
          you can even swing and stuffs you into a sack.
          "We'll have this one for supper!" says Bert.
        hint: >-
          You have been caught by trolls. Perhaps patience
          would have served you better than bravery.

  - id: gollum_attack
    event: attack
    target: gollum
    conditions:
      - !in_room goblin_cave
    effects:
      - !game_over
        message: >-
          You lunge at Gollum, but he is far quicker than
          he looks. He vanishes into the shadows and you hear
          a terrible hiss behind you. In the pitch darkness
          of the cave, you never see what hits you.
        hint: >-
          Violence was not the answer here. Perhaps riddles
          would have been wiser.

  - id: creature_attack
    event: attack
    target: creature
    conditions:
      - !in_room goblin_cave
    effects:
      - !game_over
        message: >-
          You lunge at the creature, but it is far quicker than
          it looks. It vanishes into the shadows and you hear
          a terrible hiss behind you. In the pitch darkness
          of the cave, you never see what hits you.
        hint: >-
          Violence was not the answer here. Perhaps riddles
          would have been wiser.

  # -- Talk events --

  - id: talk_gollum_riddle
    event: talk_to
    target: gollum
    conditions:
      - !in_room goblin_cave
      - !flag_unset riddle_won
    effects:
      - !start_riddle gollum_riddles

  # -- Use item events (most specific first) --

  - id: use_key_win
    event: use
    target: key
    conditions:
      - !has_item key
      - !in_room lonely_mountain
      - !has_item map
    effects:
      - !win |
          You consult the weathered map and find the hidden mark on the western face of the mountain. Moon-letters shimmer in the fading light, revealing a keyhole cunningly disguised in the rock.

          You insert the ornate key and turn it. With a grinding of ancient stone, a door swings open where there was only bare rock before.

          A passage leads deep into the heart of the mountain. After what feels like hours of walking, you emerge into an enormous hall filled with gold, jewels, and treasure beyond imagining.

          You have found the dragon's hoard of Erebor!

          Dobo Daggins, burglar extraordinaire, has reclaimed the treasure of the Lonely Mountain.

  - id: use_key_no_map
    event: use
    target: key
    conditions:
      - !has_item key
      - !in_room lonely_mountain
    effects:
      - !print >-
          You try the key on the mountainside, but without
          a map you have no idea where the secret door is.

  - id: use_key_generic
    event: use
    target: key
    conditions:
      - !has_item key
    effects:
      - !print "There is nothing to use the key on here."

  - id: use_ring
    event: use
    target: ring
    conditions:
      - !has_item ring
    effects:
      - !print >-
          You slip the ring onto your finger. The world dims
          and fades to shadow. Strange shapes swirl at the edges
          of your vision. You quickly take it off again, heart
          pounding.

  - id: use_sword
    event: use
    target: sword
    conditions:
      - !has_item sword
    effects:
      - !print "You draw the elvish blade. It hums faintly."

  - id: use_sting
    event: use
    target: sting
    conditions:
      - !has_item sword
    effects:
      - !print "You draw the elvish blade. It hums faintly."

  - id: use_bread
    event: use
    target: bread
    conditions:
      - !has_item elven_bread
    effects:
      - !print >-
          You take a bite of the elven bread. It fills you
          with warmth and renewed energy. Delicious!

  - id: use_map_mountain
    event: use
    target: map
    conditions:
      - !has_item map
      - !in_room lonely_mountain
    effects:
      - !print >-
          You study the map carefully. Moon-letters shimmer
          along the border, pointing to a spot on the western
          face of the mountain. If only you had a key to open
          the secret door...

  - id: use_map_generic
    event: use
    target: map
    conditions:
      - !has_item map
    effects:
      - !print >-
          You study the weathered map. It shows the Lonely
          Mountain and a secret door marked in red ink.

  # -- Pickup events --

  - id: ring_pickup_bell
    event: pickup
    target: ring
    effects:
      - !bell ~

# -------------------------------------------------------------------
# Riddle games
# -------------------------------------------------------------------

riddles:
  gollum_riddles:
    npc: gollum
    intro: >-
      {npc:Gollum's} eyes light up.
      {dialogue:"Riddles! We plays a game of riddles, precious!
      If it wins, we shows it the way out. If it loses...
      we eats it whole!"}
    questions:
      - question: |
          "What has roots as nobody sees,
            Is taller than trees,
            Up, up, up it goes,
            And yet never grows?"
        answer: mountain
      - question: |
          "Thirty white horses on a red hill,
            First they champ,
            Then they stamp,
            Then they stand still."
        answer: teeth
      - question: |
          "A box without hinges, key, or lid,
            Yet golden treasure inside is hid."
        answer: egg
    correct_response: >-
      {dialogue:"Yess, yess..." Gollum hisses grudgingly.
      "It knows this one, precious. But can it answer THIS?"}
    win_text: >-
      {dialogue:"Curse it! CURSE IT!" Gollum shrieks, tearing at
      his thin hair. "It wins, precious. Tricky, nasty hobbitses!"}


      Gollum, bound by his wretched promise, slinks away into
      the darkness. As he goes, you notice a faint draught of
      fresh air from the east — a hidden passage!


      {exits:A new exit has opened to the east.}
    win_effects:
      - !set_flag riddle_won
      - !open_exit
        room: goblin_cave
        direction: east
        destination: beorns_hall
      - !remove_npc gollum
    lose_text: >-
      {dialogue:"WRONG!" Gollum shrieks with glee.
      "Wrong, wrong, WRONG!"}


      Gollum lunges from the shadows with terrible speed. In the
      pitch darkness of the cave, you never stood a chance.
    lose_hint: >-
      You have been eaten by Gollum. Perhaps next time, brush up
      on your riddles.
